[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bionic-link-monitor"
version = "0.1.0"
description = "Local read-only dual serial diagnostics for Bionic Butterfly"
requires-python = ">=3.12"
dependencies = ["PySide6==6.12.0", "pyserial==3.5", "pyqtgraph==0.14.0"]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
package = ["pyinstaller==6.22.3"]

[project.gui-scripts]
link-monitor = "link_monitor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
